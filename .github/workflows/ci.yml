name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Python compile + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pipx install poetry
      - name: Install deps
        run: poetry install --no-interaction
      - name: Compile-check
        run: poetry run python -m py_compile main.py
      - name: Smoke — demo mode (no API keys required)
        run: |
          echo "y" | poetry run python main.py --demo > /tmp/demo.txt 2>&1 || true
          head -40 /tmp/demo.txt
